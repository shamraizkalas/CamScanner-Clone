name: Build CamScanner APK

on:
  workflow_dispatch:
  push:
    branches: [master, main]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: 'platform-tools'

      - name: Install 32-bit libraries
        run: |
          sudo apt-get update
          sudo apt-get install -y lib32z1 lib32stdc++6

      - name: Setup Java 17 for sdkmanager
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Install Android SDK packages and NDK 16
        env:
          SKIP_JDK_VERSION_CHECK: true
        run: |
          sdkmanager --install \
            "platforms;android-23" \
            "build-tools;25.0.0" \
            "ndk;16.1.4479499"

      - name: Select NDK 16
        run: |
          SDK_ROOT="${ANDROID_HOME:-$ANDROID_SDK_ROOT}"
          NDK_DIR="$SDK_ROOT/ndk/16.1.4479499"

          if [ ! -x "$NDK_DIR/ndk-build" ]; then
            echo "NDK not found at: $NDK_DIR"
            exit 1
          fi

          touch local.properties
          if grep -q '^ndk\.dir=' local.properties; then
            sed -i "s|^ndk\.dir=.*|ndk.dir=$NDK_DIR|" local.properties
          else
            printf '\nndk.dir=%s\n' "$NDK_DIR" >> local.properties
          fi

          echo "$NDK_DIR" >> "$GITHUB_PATH"
          echo "ANDROID_NDK_HOME=$NDK_DIR" >> "$GITHUB_ENV"

      - name: Switch to Java 8
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '8'

      - name: Build APK
        env:
          SLAVE_AAPT_TIMEOUT: 30
        run: |
          chmod +x gradlew
          ./gradlew clean assembleDebug --stacktrace

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: CamScanner-APK
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
